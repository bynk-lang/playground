name: CI

# Every push and pull request: the playground's tests at the pinned Bynk release
# (test.yml), an npm audit, and the bynk-ci gate on the share service. On `main`
# the deploy job then publishes the app and the sandbox as two Workers; anywhere
# else it does a wrangler dry run, so a broken Worker config fails before merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      # Reads the lockfile only; a high or critical advisory fails the job.
      - run: npm audit --audit-level=high

  share:
    name: Share service (bynk-ci)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Bynk release
        id: pin
        run: echo "tag=$(tr -d '[:space:]' < BYNK_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: bynk-lang/bynk-ci@26ca130282eb4fd74715388e56a629df3a7f3230 # v1.0.2
        with:
          version: ${{ steps.pin.outputs.tag }}
          working-directory: share
          source: src

  # The share service: the Bynk program in share/, deployed with bynk-deploy as the
  # Worker `snippets` with a KV namespace. It deploys live only on main with the
  # Cloudflare credentials and a committed share/bynk.deploy.lock; otherwise it checks the
  # plan. The lock must be created by a first `bynk deploy` run locally: the driver
  # refuses, in CI, to mint a KV namespace it cannot commit the id of (bynk-deploy README,
  # "CI cannot bootstrap a new KV namespace").
  # The app Worker reaches it through a service binding in the `deploy` job below.
  deploy-share:
    name: Deploy share service
    needs: [test, audit, share]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      live: ${{ steps.mode.outputs.live }}
    concurrency:
      group: deploy-share-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide between a deploy and a plan
        id: mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          echo "tag=$(tr -d '[:space:]' < BYNK_VERSION)" >> "$GITHUB_OUTPUT"
          if [ "$ON_MAIN" != true ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; planning the share service only."
            echo "live=false" >> "$GITHUB_OUTPUT"
          elif [ -f share/bynk.deploy.lock ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::share/bynk.deploy.lock is not committed, so the share service is only planned. Run bynk deploy once locally in share/ and commit the lock it writes. See README.md §Share service."
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
      # The API token reaches only this step (the action sets it for `bynk deploy`) and the
      # workers.dev step after it.
      - name: Deploy the share service
        id: deploy
        if: steps.mode.outputs.live == 'true'
        uses: bynk-lang/bynk-deploy@20eebc8606e3298fbf0f38522e2f47a9482a9b4d # v2
        with:
          version: ${{ steps.mode.outputs.tag }}
          working-directory: share
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # #25: the share service is reached only through the app Worker's service binding,
      # whose rate limit a public address would bypass. bynk deploy's wrangler.toml sets
      # neither `routes` nor `workers_dev` (and bynk.toml has no key for it), so Wrangler
      # turns the workers.dev route and preview URLs back on at every deploy: turn both
      # off again, even after a deploy that failed partway, and fail if they stay on.
      - name: Turn off the share service's workers.dev route
        if: ${{ !cancelled() && steps.mode.outputs.live == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: snippets
        run: |
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/subdomain"
          api() { curl -sS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@" "$url"; }
          api -X POST -H "Content-Type: application/json" --data '{"enabled":false,"previews_enabled":false}' >/dev/null
          state=$(api)
          echo "$state" | jq -c '{success, result}'
          if [ "$(echo "$state" | jq '.success and .result.enabled == false and .result.previews_enabled == false')" != true ]; then
            echo "::error::The $WORKER Worker's workers.dev route or preview URLs are still on, so share requests can skip the app's rate limit (#25)."
            exit 1
          fi
      - name: Plan the share service
        if: steps.mode.outputs.live != 'true'
        uses: bynk-lang/bynk-deploy@20eebc8606e3298fbf0f38522e2f47a9482a9b4d # v2
        with:
          version: ${{ steps.mode.outputs.tag }}
          working-directory: share
          dry-run: "true"
          plan-format: text
      # Should a CI deploy ever change the lock, keep it so it can be committed.
      - name: Keep the lock the deploy wrote
        if: steps.deploy.outputs.lock-changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: share-bynk-deploy-lock
          path: share/bynk.deploy.lock
      - name: Say the lock must be committed
        if: steps.deploy.outputs.lock-changed == 'true'
        run: echo "::warning::The share deploy changed share/bynk.deploy.lock. Download the share-bynk-deploy-lock artifact and commit it to share/bynk.deploy.lock before the next deploy."

  deploy:
    name: Deploy (Workers)
    # The share deploy gates only the binding, never the app: if it fails or is skipped
    # the app still deploys, without the SHARE binding, and Share falls back to #hash links.
    needs: [test, audit, share, deploy-share]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.audit.result == 'success' && needs.share.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time, and never cancel one half-way.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The credentials are attached only to the two deploy steps, never to the
      # job, so `npm ci` install scripts never see them. A pull request (forks
      # included) never deploys: it gets no secrets, and `live` is false for it.
      - name: Decide between a deploy and a dry run
        id: mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$ON_MAIN" != true ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; dry run only. See README.md §Deploy."
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Stage the pinned release's browser artefacts
        run: npm run fetch:assets
      # Production origins are build.mjs's defaults.
      - name: Bundle
        run: npm run build
      # Bind the share service only in a run that has just deployed it: Cloudflare
      # rejects an upload that binds a Worker that does not exist.
      - name: Choose the app config
        id: appconfig
        env:
          SHARE_LIVE: ${{ needs.deploy-share.outputs.live }}
          SHARE_RESULT: ${{ needs.deploy-share.result }}
        run: |
          if [ "$SHARE_LIVE" = true ] && [ "$SHARE_RESULT" = success ]; then
            node scripts/with-share-binding.mjs
            echo "config=wrangler.app.share.jsonc" >> "$GITHUB_OUTPUT"
          else
            echo "config=wrangler.app.jsonc" >> "$GITHUB_OUTPUT"
          fi
      # Two Workers, two origins. That separation is the safety boundary
      # (ADR 0140): untrusted snippet code runs only on the sandbox origin.
      # The sandbox first (#33): the app is what visitors load, and it picks its sandbox up
      # from the sandbox origin, so a new app should never meet an old sandbox. Keep
      # changes to the app↔sandbox protocol readable by the previous version of the app.
      - name: Deploy the sandbox (sandbox.bynk-lang.dev)
        if: steps.mode.outputs.live == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy --config wrangler.sandbox.jsonc
      - name: Deploy the app (playground.bynk-lang.dev)
        if: steps.mode.outputs.live == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG: ${{ steps.appconfig.outputs.config }}
        run: npx --yes wrangler@4.152.0 deploy --config "$CONFIG"
      - name: Dry run both Workers
        if: steps.mode.outputs.live != 'true'
        env:
          CONFIG: ${{ steps.appconfig.outputs.config }}
        run: |
          npx --yes wrangler@4.152.0 deploy --config "$CONFIG" --dry-run
          # The binding variant too, so a mistake in it fails before a live run meets it.
          node scripts/with-share-binding.mjs
          npx --yes wrangler@4.152.0 deploy --config wrangler.app.share.jsonc --dry-run
          npx --yes wrangler@4.152.0 deploy --config wrangler.sandbox.jsonc --dry-run
